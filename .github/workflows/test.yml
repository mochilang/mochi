name: Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26'
          cache-dependency-path: |
            go.sum

      - name: Build
        shell: bash
        run: |
          go build -v ./parser/... ./runtime/vm/... ./types/...

      - name: Run portable tests
        shell: bash
        run: |
          go test -vet=off -v ./parser/... ./runtime/vm/... ./types/...

      - name: Run full Linux suite with coverage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          go test -vet=off -v -race \
            -coverprofile=coverage.txt \
            -covermode=atomic \
            ./parser/... ./runtime/vm/...
          go test -vet=off -v ./types/... -run TestSoundness

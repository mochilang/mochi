name: BEAM transpiler tests

# MEP-46 Phase 16.0: CI gate for the Mochi-to-BEAM transpiler test suite.
# Installs Erlang/OTP and runs the full beam/build test suite on Linux and
# macOS. Covers OTP 28 (latest) initially; OTP 27 matrix added in Phase 16.1.

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'transpiler3/beam/**'
      - 'transpiler3/c/aotir/**'
      - 'transpiler3/c/lower/**'
      - '.github/workflows/transpiler3-beam-test.yml'

jobs:
  beam-test:
    name: BEAM test (OTP ${{ matrix.otp }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            otp: '28'
          - os: macos-latest
            otp: '28'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26'
          cache-dependency-path: go.sum

      - name: Set up Erlang/OTP ${{ matrix.otp }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          version-type: loose

      - name: Verify OTP installation
        run: erl -noshell -eval 'io:format("OTP ~s~n",[erlang:system_info(otp_release)]),halt()'

      - name: Run BEAM transpiler tests
        run: go test -v -timeout 300s ./transpiler3/beam/...

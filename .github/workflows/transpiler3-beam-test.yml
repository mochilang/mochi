name: BEAM transpiler tests

# MEP-46: CI gate for the Mochi-to-BEAM transpiler test suite.
# Phase 16.0: OTP 28 on Linux + macOS (blocking).
# Phase 16.1: OTP 27 added to blocking matrix.
# Phase 16.2: OTP 29 RC added as non-blocking nightly.
# Phase 16.3: Windows x86-64 best-effort (non-blocking).

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'transpiler3/beam/**'
      - 'transpiler3/c/aotir/**'
      - 'transpiler3/c/lower/**'
      - '.github/workflows/transpiler3-beam-test.yml'
  schedule:
    # Phase 16.2: nightly run on OTP 29 RC (non-blocking).
    - cron: '0 3 * * *'

jobs:
  beam-test:
    name: BEAM test (OTP ${{ matrix.otp }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            otp: '28'
            blocking: true
          - os: macos-latest
            otp: '28'
            blocking: true
          - os: ubuntu-latest
            otp: '27'
            blocking: true
          - os: macos-latest
            otp: '27'
            blocking: true
          - os: ubuntu-latest
            otp: '29'
            blocking: false
          - os: macos-latest
            otp: '29'
            blocking: false
          - os: windows-latest
            otp: '27'
            blocking: false
          - os: windows-latest
            otp: '28'
            blocking: false

    continue-on-error: ${{ !matrix.blocking }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26'
          cache-dependency-path: go.sum

      - name: Set up Erlang/OTP ${{ matrix.otp }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          version-type: loose

      - name: Verify OTP installation
        run: erl -noshell -eval 'io:format("OTP ~s~n",[erlang:system_info(otp_release)]),halt()'

      - name: Run BEAM transpiler tests
        run: go test -v -timeout 300s ./transpiler3/beam/...

name: Transpiler3-C Cross Tier-1 Matrix

# MEP-45 Phase 11: cross-compile the fixture corpus for all 8 tier-1 triples
# and run the produced binaries where possible.
#
# Coverage per runner:
#
#   ubuntu-latest (linux/amd64):
#     - 11.0 x86_64-linux-gnu  : native build + run
#     - 11.1 x86_64-linux-musl : zig cc cross + native run
#     - 11.2 aarch64-linux-gnu : zig cc cross + qemu-aarch64-static run
#     - 11.3 aarch64-linux-musl: zig cc cross + qemu-aarch64-static run
#     - 12.0 wasm32-wasi       : zig cc cross + wasmtime run
#
#   macos-latest (darwin/arm64):
#     - 11.4 aarch64-darwin    : native build + run
#     - 11.5 x86_64-darwin     : zig cc cross + Rosetta 2 run-gate
#
#   macos-13 (darwin/amd64):
#     - 11.5 x86_64-darwin     : native build + run
#
#   windows-latest:
#     - 11.6 x86_64-windows-msvc: native build + run (host cc / clang-cl)
#     - 11.7 x86_64-windows-gnu : zig cc cross + native run

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  cross-linux:
    name: Tier-1 cross (ubuntu-latest)
    runs-on: ubuntu-latest

    env:
      MOCHI_TEST_ZIG_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26'
          cache-dependency-path: go.sum

      - name: Install qemu-aarch64-static
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
          qemu-aarch64-static --version | head -1

      - name: Phase 11.0 - x86_64-linux-gnu native
        run: |
          go test -vet=off -v -count=1 -timeout=120s \
            ./transpiler3/c/build/ -run TestPhase11NativeLinux

      - name: Phase 11.1 - x86_64-linux-musl (zig cc)
        run: |
          go test -vet=off -v -count=1 -timeout=300s \
            ./transpiler3/c/build/ -run TestPhase11MuslX86

      - name: Phase 11.3 - aarch64-linux-musl (zig cc + qemu)
        run: |
          go test -vet=off -v -count=1 -timeout=300s \
            ./transpiler3/c/build/ -run TestPhase11AArch64LinuxMusl

      - name: Phase 11.2 - aarch64-linux-gnu (zig cc + qemu)
        run: |
          go test -vet=off -v -count=1 -timeout=300s \
            ./transpiler3/c/build/ -run TestPhase11AArch64LinuxGnu

      - name: Install wasmtime
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Phase 12.0 - wasm32-wasi (zig cc + wasmtime run)
        run: |
          go test -vet=off -v -count=1 -timeout=300s \
            ./transpiler3/c/build/ -run TestPhase12WasmWasi

  cross-macos:
    name: Tier-1 cross (macos-latest arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26'
          cache-dependency-path: go.sum

      - name: Phase 11.4 - aarch64-darwin native
        run: |
          go test -vet=off -v -count=1 -timeout=120s \
            ./transpiler3/c/build/ -run TestPhase11NativeDarwin

      - name: Phase 11.5 - x86_64-darwin (zig cc cross + Rosetta 2 run)
        env:
          MOCHI_TEST_ZIG_DOWNLOAD: '1'
        run: |
          go test -vet=off -v -count=1 -timeout=300s \
            ./transpiler3/c/build/ -run TestPhase11X86DarwinCross

  cross-macos-x86:
    name: Tier-1 cross (macos-13 x86_64 native)
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26'
          cache-dependency-path: go.sum

      - name: Phase 11.5 - x86_64-darwin native
        run: |
          go test -vet=off -v -count=1 -timeout=120s \
            ./transpiler3/c/build/ -run TestPhase11NativeDarwin

  cross-windows:
    name: Tier-1 cross (windows-latest)
    runs-on: windows-latest

    env:
      MOCHI_TEST_ZIG_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.26'
          cache-dependency-path: go.sum

      - name: Phase 11.6 - x86_64-windows-msvc native
        run: |
          go test -vet=off -v -count=1 -timeout=120s `
            ./transpiler3/c/build/ -run TestPhase11NativeWindows

      - name: Phase 11.7 - x86_64-windows-gnu (zig cc + native run)
        run: |
          go test -vet=off -v -count=1 -timeout=300s `
            ./transpiler3/c/build/ -run TestPhase11WindowsGnu

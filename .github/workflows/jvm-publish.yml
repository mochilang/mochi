name: Publish mochi-runtime to Maven Central

on:
  push:
    tags:
      - 'v0.*'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Check secrets and import GPG key
        id: check
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GPG_PRIVATE_KEY not configured; skipping publish"
          elif echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>/dev/null; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GPG_PRIVATE_KEY is not valid GPG data; skipping publish"
          fi
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Publish to Maven Central
        if: steps.check.outputs.configured == 'true'
        run: |
          mvn -f transpiler3/jvm/runtime/pom.xml \
            --no-transfer-progress \
            deploy \
            -Dgpg.passphrase="$GPG_PASSPHRASE"
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  verify-gate:
    runs-on: ubuntu-24.04
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.26'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build runtime jar (local)
        run: mvn -f transpiler3/jvm/runtime/pom.xml package -DskipTests -Dgpg.skip=true -q
      - name: Run TestPhase18Publish gate
        run: go test ./transpiler3/jvm/build/ -run TestPhase18Publish -v
